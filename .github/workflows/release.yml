name: release

# When VERSION changes on main, publish a GitHub Release for it (tag vX.Y.Z) using that version's CHANGELOG entry.
# People who Watch the repo (Custom > Releases) get an email. Does nothing if the release already exists.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release this version if it has none yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"; tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released"; exit 0; fi
          awk -v ver="$v" '$0 ~ "^## " ver " " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }
          gh release create "$tag" --target "$GITHUB_SHA" --title "Susanoo Reel Kit $v" --notes-file notes.md
